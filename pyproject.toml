[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cross-border-ai"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["langgraph>=1.0,<2", "httpx>=0.27,<1"]

[tool.setuptools.packages.find]
include = ["my_agent*", "gangweiceshi.data_extractors*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
