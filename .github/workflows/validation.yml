name: Validation

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: gangweiceshi/data_extractors/requirements.txt
      - run: python -m pip install -r gangweiceshi/data_extractors/requirements.txt pytest
      - run: python -m pytest tests -q
        env:
          AI_API_KEY: ''
          EMBEDDING_API_KEY: ''
      - run: python -m compileall -q gangweiceshi/data_extractors my_agent

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: gangweiceshi/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: gangweiceshi/frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f compose.langgraph.yml config --quiet
        env:
          AI_API_KEY: ci-build-only-not-a-real-key
      - run: docker compose -f compose.langgraph.yml build python_api frontend
        env:
          AI_API_KEY: ci-build-only-not-a-real-key
      - name: Start services and verify HTTP readiness
        env:
          AI_API_KEY: ci-build-only-not-a-real-key
        run: |
          docker compose -f compose.langgraph.yml up -d vector_db
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:6333/collections > /dev/null; then break; fi
            sleep 2
          done
          curl --fail --silent http://localhost:6333/collections > /dev/null
          docker compose -f compose.langgraph.yml up -d python_api frontend
          python - <<'PY'
          import json
          import time
          from urllib.request import urlopen

          for attempt in range(30):
              try:
                  with urlopen("http://localhost:8000/health", timeout=3) as response:
                      health = json.load(response)
                  if health["vector_db"] != "connected":
                      raise RuntimeError("Qdrant not connected yet")
                  with urlopen("http://localhost:8000/api/knowledge/index", timeout=3) as response:
                      assert json.load(response)["status"] == "idle"
                  with urlopen("http://localhost:3000", timeout=3) as response:
                      assert '<div id="root">' in response.read().decode()
                  break
              except Exception:
                  if attempt == 29:
                      raise
                  time.sleep(2)
          PY
      - name: Stop test services
        if: always()
        env:
          AI_API_KEY: ci-build-only-not-a-real-key
        run: docker compose -f compose.langgraph.yml down
